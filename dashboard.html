<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Passenger Ride Analytics</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h1 {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 15px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    table {
      border-collapse: collapse;
      width: 80%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 14px 18px;
      text-align: center;
    }

    thead {
      background: #4facfe;
      color: white;
    }

    tbody tr:hover {
      background-color: #f1f9ff;
      cursor: pointer;
    }

    tbody td {
      border-bottom: 1px solid #f0f0f0;
    }

    .footer {
      margin-top: 40px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Passenger Ride Analytics Dashboard</h1>

  <table id="analyticsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Total Rides</th>
        <th>Total Fare (RM)</th>
        <th>Avg Distance (km)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="footer">
    MyTaxi Analytics &copy; 2025
  </div>

  <script>
    fetch('http://localhost:3000/analytics/passengers')
      .then(response => response.json())
      .then(data => {
        const tbody = document.querySelector('#analyticsTable tbody');
        data.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.name}</td>
            <td>${user.totalRides}</td>
            <td>${user.totalFare.toFixed(2)}</td>
            <td>${user.avgDistance.toFixed(2)}</td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(error => {
        alert('❌ Failed to fetch data from the server. Make sure Node.js is running and CORS is enabled.');
        console.error(error);
      });
  </script>

</body>
</html>
